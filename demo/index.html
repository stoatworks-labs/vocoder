  <body>
    <main id="demo">
      <noscript>
        <h1>Vocoder</h1>
        <p>
          An FFGL effect that splits the frame into eight octave bands of
          spatial frequency and sets each band's gain from the matching band of
          the audio. With every gain at 1× the input comes back untouched, to
          the bit, and everything else it does is built on that.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/vocoder">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/vocoder/">Project page and downloads</a></li>
          <li><a href="https://github.com/stoatworks-labs/vocoder">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
